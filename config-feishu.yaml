# ============================================================
# 飞书机器人配置（通过 SSE 连接远程 MCP Server）
# 启动命令: python -m src.main --mode feishu --config config-feishu.yaml
# ============================================================

# 飞书机器人配置
feishu:
  app_id: "${FEISHU_APP_ID}"              # 飞书应用 App ID
  app_secret: "${FEISHU_APP_SECRET}"       # 飞书应用 App Secret
  encrypt_key: "${FEISHU_ENCRYPT_KEY}"     # 事件加密 key（可选，为空则不启用加密）
  verification_token: "${FEISHU_VERIFICATION_TOKEN}"  # 事件验证 token
  host: "0.0.0.0"                          # 监听地址
  port: 8080                               # 监听端口
  session_ttl: 1800                        # 会话超时（秒），默认 30 分钟

# Agent 配置
agent:
  model: "claude-sonnet-4-20250514"
  provider: "anthropic"
  api_key: "${ANTHROPIC_API_KEY}"

# MCP Server 列表
# Agent 启动时自动从这些 server 发现业务和集群，无需本地配置 businesses
mcp_servers:
  - name: "mcp-server"
    url: "${MCP_SERVER_URL}"
    api_key: "${MCP_API_KEY}"

# ============================================================
# 飞书开放平台配置步骤：
#
# 1. 访问 https://open.feishu.cn 创建企业自建应用
# 2. 在应用能力中添加"机器人"
# 3. 在事件订阅中添加 im.message.receive_v1 事件
# 4. 设置事件回调 URL: https://your-server:8080/webhook/event
# 5. 配置 Encrypt Key 和 Verification Token
# 6. 发布应用，在群聊中添加机器人
# 7. 在群聊中 @机器人 发送查询消息
#
# 业务发现机制：
# - Agent 启动时自动调用每个 MCP Server 的 get_business_list
# - 发现业务后自动注册并获取集群路由
# - 不需要在本地配置 businesses 段
# ============================================================
